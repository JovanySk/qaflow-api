spring:
  application:
    name: qaflow-backend
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: QAFlow Backend
    version: "@project.version@"
    java-target: "17"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"

qaflow:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ${JWT_ISSUER:qaflow-backend}
      audience: ${JWT_AUDIENCE:qaflow-web}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  bootstrap:
    enabled: ${QAFLOW_BOOTSTRAP_ENABLED:false}
    admin-username: ${QAFLOW_ADMIN_USERNAME:admin.demo}
    admin-display-name: ${QAFLOW_ADMIN_DISPLAY_NAME:Demo Administrator}
    admin-password: ${QAFLOW_ADMIN_PASSWORD:}
    operator-username: ${QAFLOW_OPERATOR_USERNAME:operator.demo}
    operator-display-name: ${QAFLOW_OPERATOR_DISPLAY_NAME:Demo Operator}
    operator-password: ${QAFLOW_OPERATOR_PASSWORD:}
    inspector-username: ${QAFLOW_INSPECTOR_USERNAME:inspector.demo}
    inspector-display-name: ${QAFLOW_INSPECTOR_DISPLAY_NAME:Demo Quality Inspector}
    inspector-password: ${QAFLOW_INSPECTOR_PASSWORD:}
